# Alembic configuration (ARQ-03).
#
# The application runs the migrations by itself on startup (see
# app/db/migrations.py), so this file is only needed for the CLI:
#   alembic upgrade head
#   alembic revision -m "describe the change"
#   alembic current
# The database URL comes from the DATABASE_URL environment variable
# (default: sqlite:///./data/todo.db); see migrations/env.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
