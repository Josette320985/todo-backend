# Project tooling configuration (mypy and pytest).

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make "app" importable when running the plain "pytest" command (CI).
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests, excluded from the CI on every push (-m \"not slow\")",
]

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

# Pydantic plugin: understands BaseModel/BaseSettings fields and validators.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ldap3", "ldap3.*", "sentry_sdk", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
