# Project tooling configuration (mypy and pytest).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

# Pydantic plugin: understands BaseModel/BaseSettings fields and validators.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
