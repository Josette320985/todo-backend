# Backend CI (TEST-10): type checking, tests with coverage and dependency audit.
# Runs on every pull request and on pushes to the integration branches.
name: backend-ci

on:
  pull_request:
  push:
    branches: [main, equipo3]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Type check (mypy --strict, configured in pyproject.toml)
        run: mypy

      # Slow tests (marked @pytest.mark.slow) are excluded from every push;
      # they will run on a schedule together with the E2E suite (TEST-09).
      # Coverage is reported from day 1; the 80% gate on services/ and
      # repositories/ is added after the refactor (ARQ-02, ARQ-04).
      - name: Tests with coverage
        run: >
          pytest -m "not slow"
          --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: pip-audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until SEG-H04 (P4) upgrades starlette and replaces
    # python-jose; today it reports known, unreachable advisories (report
    # section 8). Remove this line once pip-audit is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Audit requirements.txt
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
