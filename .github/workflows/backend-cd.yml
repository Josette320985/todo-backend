# Backend CD (F4): runs mypy, pytest + coverage gate, pip-audit, publishes the
# Docker image to GHCR, and deploys the production stack over SSH on main.
name: backend-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: mypy + pytest + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests with coverage
        run: >
          pytest -m "not slow"
          --cov=app --cov-report=term-missing

      - name: Coverage gate (services/ and repositories/ >= 80%)
        run: >
          coverage report --fail-under=80
          --include="app/services/*,app/repositories/*"

      - name: Audit production dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build-and-push:
    name: build and push image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy stack to production server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy backend and reverse-proxy stack over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::notice::SSH deploy skipped: configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY secrets to enable remote deployment."
            exit 0
          fi

          IMAGE_REPO="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          REMOTE_PATH="${DEPLOY_PATH:-/opt/todo-app/todo-backend}"
          SSH_PORT="${DEPLOY_PORT:-22}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${DEPLOY_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            STRICT_OPT="yes"
          else
            STRICT_OPT="accept-new"
          fi

          REMOTE_ENV="$(printf 'DEPLOY_PATH=%q BACKEND_IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q' \
            "${REMOTE_PATH}" "ghcr.io/${IMAGE_REPO}:latest" "${GHCR_USER}" "${GHCR_TOKEN}")"

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o "StrictHostKeyChecking=${STRICT_OPT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${REMOTE_ENV} bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER:-$USER}" --password-stdin
          fi
          export BACKEND_IMAGE
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          ${COMPOSE} pull
          ${COMPOSE} up -d --no-build --remove-orphans
          ${COMPOSE} exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"
          ${COMPOSE} ps
          docker image prune -f
          EOF

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
