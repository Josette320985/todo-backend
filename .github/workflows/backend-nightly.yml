# Backend nightly (TEST-10): long-running tests that are too slow for every push.
# Runs once a day, on every push to main, and on demand (Actions > Run workflow).
#
# Note: GitHub only fires "schedule" from the default branch (main), so the
# daily run starts once this file reaches main. Until then, use "Run workflow"
# on equipo3.
name: backend-nightly

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 03:00 in Mexico City
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    name: pytest -m slow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # pytest exits with 5 when no test matches the marker. Until the first
      # @pytest.mark.slow test lands (TEST-06), that is not a failure.
      - name: Slow tests
        run: |
          set +e
          pytest -m slow
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests marked slow yet."
            exit 0
          fi
          exit "$code"

  # E2E with Playwright over the real docker-compose stack (TEST-09).
  # docker-compose.yml builds the frontend from ../todo-frontend, so both
  # repositories are checked out as siblings, like in a developer's machine.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: todo-backend

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/todo-frontend
          # Same integration branch as the backend when it exists there.
          ref: ${{ github.ref_name == 'main' && 'main' || 'equipo3' }}
          path: todo-frontend

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: todo-backend/e2e/package-lock.json

      - name: Install Playwright
        working-directory: todo-backend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check
        working-directory: todo-backend/e2e
        run: npx tsc --noEmit

      # global-setup builds and starts the stack; global-teardown removes it.
      - name: E2E
        working-directory: todo-backend/e2e
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        working-directory: todo-backend
        run: docker compose -p todo-e2e -f docker-compose.yml -f e2e/docker-compose.e2e.yml logs --no-color --tail 200 || true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: todo-backend/e2e/playwright-report/
          retention-days: 7
